name: lumical
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: lumical_bootstrap
      POSTGRES_DB: ${POSTGRES_DB:-lumical_dev}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Generate a local bootstrap password}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate a local migration password}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Generate a local runtime password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The initialization server is socket-only. Authenticate over final TCP
      # and require the initialized migration owner and runtime schema access.
      test:
        - CMD-SHELL
        - >-
          test "$$(PGPASSWORD="$$RUNTIME_DB_PASSWORD" PGCONNECT_TIMEOUT=2
          psql -h 127.0.0.1 -U lumical_runtime -d "$$POSTGRES_DB" -X -Atqc
          "SELECT has_schema_privilege(current_user, 'lumical', 'USAGE')
          AND EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='lumical'
          AND nspowner='lumical_migration'::regrole)")" = t
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    environment:
      MIGRATION_DATABASE_URL: postgresql://lumical_migration:${MIGRATION_DB_PASSWORD:?Set migration password}@postgres:5432/${POSTGRES_DB:-lumical_dev}?schema=lumical
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://lumical_runtime:${RUNTIME_DB_PASSWORD:?Set runtime password}@postgres:5432/${POSTGRES_DB:-lumical_dev}?schema=lumical
      IDENTITY_SECRET_KEY: ${IDENTITY_SECRET_KEY:?Generate a 32-byte identity key}
      IDENTITY_ALLOWED_ORIGINS: ${IDENTITY_ALLOWED_ORIGINS:?Set the exact HTTPS frontend origin}
      IDENTITY_COOKIE_MODE: https
      IDENTITY_TRUSTED_PROXY_IPS: ${LUMICAL_GATEWAY_IP:-172.30.240.2}
      IDENTITY_AUTH_ATTEMPTS: ${IDENTITY_AUTH_ATTEMPTS:-10}
      IDENTITY_AUTH_WINDOW_SECONDS: ${IDENTITY_AUTH_WINDOW_SECONDS:-600}
      IDENTITY_AUTH_BUCKETS: ${IDENTITY_AUTH_BUCKETS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:3001
  gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      BACKEND_URL: http://backend:3001
      FRONTEND_URL: http://frontend:3000
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      default:
        ipv4_address: ${LUMICAL_GATEWAY_IP:-172.30.240.2}

networks:
  default:
    ipam:
      config:
        - subnet: ${LUMICAL_NETWORK_SUBNET:-172.30.240.0/24}
          ip_range: ${LUMICAL_DYNAMIC_IP_RANGE:-172.30.240.128/25}

volumes:
  postgres_data:
